[project]
name = "outlook-client"
version = "0.1.0"
description = "Microsoft Graph API Client for reading and sending Outlook emails"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "authlib>=1.4.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "python-dotenv>=1.0.1",
    "ruff>=0.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/outlook_client",
    "/README.md",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["outlook_client"]
